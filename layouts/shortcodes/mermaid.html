<style>
    /* 1. 控制图表尺寸：水平居中，允许横向滚动 */
    .mermaid-container {
        display: flex;
        justify-content: center;
        width: 100%;
        overflow-x: auto;
        margin: 1.5rem 0;
        cursor: zoom-in; 
        transition: all 0.3s ease;
    }
    .mermaid-container svg {
        max-width: 100%;
        height: auto;
        background-color: var(--card-background); 
        border-radius: 8px;
    }

    /* 2. 核心魔法：点击全屏放大模式 */
    .mermaid-fullscreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 99999;
        background: rgba(0, 0, 0, 0.7); 
        backdrop-filter: blur(5px);     
        display: flex;
        align-items: flex-start;        
        justify-content: center;
        overflow-y: auto;               
        padding: 3rem 1rem;
        margin: 0;
        cursor: zoom-out;               
    }
    .mermaid-fullscreen svg {
        max-width: 90vw;                
        min-width: 800px;               
        transform: scale(1.05);         
        transform-origin: top center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
        padding: 1.5rem;
    }

    /* 3. 源码折叠面板样式 */
    .mermaid-source-panel {
        background-color: var(--card-background);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        margin-bottom: 2rem;
        padding: 0.5rem 1rem;
    }
    .mermaid-source-panel summary {
        cursor: pointer;
        font-size: 0.85rem;
        color: var(--body-text-color);
        font-weight: 600;
        user-select: none;
    }
    .mermaid-source-panel summary:hover {
        opacity: 0.8;
    }
    .mermaid-source-panel .highlight {
        margin-top: 1rem;
        margin-bottom: 0;
    }
</style>

<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    const isDarkMode = document.documentElement.dataset.scheme === 'dark';
    mermaid.initialize({ 
        startOnLoad: true, 
        theme: isDarkMode ? 'dark' : 'default',
        securityLevel: 'loose'
    });

    // 【新增核心修复】：在页面加载后，精准拦截并修正语言标签
    window.addEventListener('load', () => {
        // 只寻找 mermaid-source-panel 内部的语言标签，绝对不影响文章其他代码块
        document.querySelectorAll('.mermaid-source-panel .code-language').forEach(label => {
            label.textContent = 'Mermaid';
        });
    });
</script>

<!-- 图表渲染区 -->
<div class="mermaid-container" onclick="this.classList.toggle('mermaid-fullscreen')" title="点击全屏放大/缩小">
    <div class="mermaid">
        {{ .Inner | safeHTML }}
    </div>
</div>

<!-- 源码折叠区：【注意这里】将 "mermaid" 换成了 "text"，防止 Chroma 引擎去匹配 Gdscript3 -->
<details class="mermaid-source-panel">
    <summary>▼ 查看 / 复制 Mermaid 源码</summary>
    {{ highlight .Inner "text" "" }}
</details>

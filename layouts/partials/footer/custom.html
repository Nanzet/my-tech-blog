<script>
  document.addEventListener("DOMContentLoaded", function () {
    const codeBlocks = document.querySelectorAll(".highlight");

    codeBlocks.forEach((block) => {
      const codeContent = Array.from(block.children).find((child) =>
        !child.matches(
          ".code-toolbar, .code-filename, .copyCodeButton, .languageCodeButton, .toggleCodeButton"
        )
      );

      if (codeContent) {
        codeContent.classList.add("code-content");
      }

      const title = block.getAttribute("title");
      if (title) {
        const filenameDiv = document.createElement("div");
        filenameDiv.className = "code-filename";
        filenameDiv.textContent = title;
        block.appendChild(filenameDiv);
        block.removeAttribute("title"); 
      }

      block.classList.remove("collapsed");
      block.classList.add("code-expanded");

      const toolbar = block.querySelector(".code-toolbar") || document.createElement("div");
      toolbar.className = "code-toolbar";

      if (!toolbar.parentElement) {
        block.prepend(toolbar);
      }

      const syncToolbarControls = () => {
        const controls = [
          block.querySelector(".languageCodeButton"),
          block.querySelector(".copyCodeButton"),
          block.querySelector(".toggleCodeButton"),
        ];

        controls.forEach((control) => {
          if (control) {
            toolbar.appendChild(control);
          }
        });
      };

      if (block.querySelector(".toggleCodeButton")) {
        syncToolbarControls();
        return;
      }

      const toggleButton = document.createElement("button");
      toggleButton.className = "toggleCodeButton";
      toggleButton.type = "button";
      toggleButton.setAttribute("aria-label", "收起代码");
      toggleButton.setAttribute("title", "收起代码");
      toggleButton.innerHTML = `
        <svg class="toggleCodeIcon" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M5 12.5 10 7.5l5 5" />
        </svg>
      `;

      toggleButton.addEventListener("click", function () {
        const blockWasAboveViewport = block.getBoundingClientRect().top < 0;
        const isCollapsed = block.classList.toggle("code-collapsed");
        block.classList.toggle("code-expanded", !isCollapsed);
        toggleButton.classList.toggle("is-collapsed", isCollapsed);
        toggleButton.setAttribute("aria-expanded", String(!isCollapsed));
        toggleButton.setAttribute("aria-label", isCollapsed ? "展开代码" : "收起代码");
        toggleButton.setAttribute("title", isCollapsed ? "展开代码" : "收起代码");

        if (isCollapsed && blockWasAboveViewport) {
          requestAnimationFrame(() => {
            block.scrollIntoView({ behavior: "auto", block: "start" });
          });
        }
      });

      toolbar.appendChild(toggleButton);
      toggleButton.setAttribute("aria-expanded", "true");
      syncToolbarControls();

      const observer = new MutationObserver(syncToolbarControls);
      observer.observe(block, {
        childList: true,
      });

      window.addEventListener("load", syncToolbarControls, { once: true });
    });
  });
</script>

  crossorigin="anonymous" />
<script>
  NProgress.start();
  document.addEventListener("readystatechange", () => {
    if (document.readyState === "interactive") NProgress.inc(0.8);
    if (document.readyState === "complete") NProgress.done();
  });
</script>

{{ if .Site.Params.comments.enabled }}
<script type="module">
  const pageviewNodes = Array.from(
    document.querySelectorAll(".waline-pageview-count"),
  );

  if (pageviewNodes.length > 0) {
    const walineModuleURL = '{{ "vendor/waline/waline.3.8.0.js" | relURL }}';
    const startAt = performance.now();
    const pendingNodes = new Set(
      pageviewNodes.filter((node) => node.textContent.trim() === "Loading..."),
    );

    const finishIfReady = () => {
      for (const node of Array.from(pendingNodes)) {
        if (node.textContent.trim() !== "Loading...") {
          pendingNodes.delete(node);
        }
      }

      if (pendingNodes.size === 0) {
        console.info(
          `[Waline] pageview loaded in ${Math.round(performance.now() - startAt)}ms for ${pageviewNodes.length} item(s)`,
        );
        return true;
      }

      return false;
    };

    if (!finishIfReady()) {
      const observer = new MutationObserver(() => {
        if (finishIfReady()) {
          observer.disconnect();
        }
      });

      pageviewNodes.forEach((node) => {
        observer.observe(node, {
          childList: true,
          characterData: true,
          subtree: true,
        });
      });

      window.setTimeout(() => {
        observer.disconnect();
        console.warn(
          `[Waline] pageview still pending after ${Math.round(performance.now() - startAt)}ms`,
        );
      }, 10000);
    }

    const { pageviewCount } = await import(walineModuleURL);

    pageviewCount({
      serverURL: "{{ .Site.Params.comments.waline.serverURL }}",
      selector: ".waline-pageview-count",
      update:
        "{{ if and .IsPage (not hugo.IsServer) }}true{{ else }}false{{ end }}" ===
        "true",
    });
  }
</script>
{{- end -}}
